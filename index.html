
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEGA // UNITY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass {
            background: rgba(10, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 0, 0, 0.15);
        }
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255, 0, 0, 0.2);
            animation: scan 3s linear infinite;
            pointer-events: none;
            z-index: 20;
        }
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .pure-red-glow {
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }
        .red-grid {
            background-image: radial-gradient(circle at 1px 1px, rgba(255, 0, 0, 0.07) 1px, transparent 0);
            background-size: 32px 32px;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #330000; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff0000; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
      }
    }
    </script>
</head>
<body class="red-grid min-h-screen selection:bg-red-900 selection:text-white">
    <div id="root"></div>
</body>
</html>
